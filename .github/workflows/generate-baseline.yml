# Regenereert baseline/conditional-access/baseline-v1.0.json uit CATemplate/GLOBAL__*.json
# bij elke push naar main die die map wijzigt, en opent daar een PR voor — nooit een
# stilzwijgende commit op main, zelfde reden als writeBackBaseline in het gekoppelde
# platform (TEST Policies Platform): een gegenereerd bestand dat niemand review't is
# precies het soort ongeziene wijziging die baseline-drift veroorzaakt.
#
# Run het script lokaal (`node scripts/generate-baseline.js`) om te zien wat een wijziging
# aan een policy-template oplevert vóór je 'm pusht.

name: Genereer baseline uit CATemplate

on:
  push:
    branches: [main]
    paths:
      - "CATemplate/**"
      - "prerequisites/**"
      - "scripts/generate-baseline.js"
      - "scripts/prerequisites.js"
      - "scripts/export-cipp-baseline.js"
      - "controls/**"
      - "scripts/check-controls.js"
      - "authentication-methods/**"
      - "scripts/authentication-methods.js"
      - ".github/workflows/generate-baseline.yml"
  # Ook op een PR, en dat is de belangrijkste van de twee: een template zonder gepind
  # checkId of met een verwijzing naar een ongedefinieerde groep moet stuklopen terwijl de
  # auteur nog weet welke groep hij bedoelde. Draaide dit alleen op main, dan zag je het pas
  # ná de merge - met een gegenereerde baseline die dan al niet meer klopt.
  pull_request:
    paths:
      - "CATemplate/**"
      - "prerequisites/**"
      - "scripts/generate-baseline.js"
      - "scripts/prerequisites.js"
      - "scripts/export-cipp-baseline.js"
      - "controls/**"
      - "scripts/check-controls.js"
      - "authentication-methods/**"
      - "scripts/authentication-methods.js"
      - ".github/workflows/generate-baseline.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Vóór het genereren: verwijst elk template naar een groep of named location die in
      # prerequisites/ca-prerequisites.json gedefinieerd is? Een verwijzing zonder definitie
      # is bij een toetsing een meetfout, maar sinds cipp/ ook een uitrol voedt is het een
      # lock-out: een uitzonderingsgroep die bij de klant niet bestaat sluit niemand uit.
      - name: Controleer de randvoorwaarden
        run: node scripts/prerequisites.js

      - name: Genereer baseline/conditional-access/baseline-v1.0.json
        run: node scripts/generate-baseline.js

      # De CIPP-uitrolkant uit dezelfde templates. Altijd zonder --remediate-stage1: welke
      # stage mag afdwingen is een beslissing per klanttenant, na New-CaPrerequisites.ps1,
      # en niet iets wat in een gegenereerd bestand op main hoort te staan.
      - name: Genereer cipp/ (templates-import en stage-indeling)
        run: node scripts/export-cipp-baseline.js

      # Ná het genereren, want een deel van de tests kijkt naar het resultaat. Faalt deze
      # stap, dan wordt er géén PR geopend: een baseline met een hernummerd checkId is
      # schadelijker dan geen bijgewerkte baseline — dat id is de sleutel voor drift over
      # runs heen en voor de klantuitzonderingen in het gekoppelde platform.
      # De normenmapping die COMPLIANCE.md in de IntuneBackup-repo voedt. Hier alleen de
      # structuur: heeft elk template een regel, en noemt geen regel een template dat niet
      # bestaat. Of de labels in de vocabulaire staan kan hier niet - die woont in die andere
      # repo - en wordt daar door generate-compliance.js --strict bewaakt.
      - name: Controleer de normenmapping
        run: node scripts/check-controls.js

      # De authenticatiemethoden hebben geen checkId en worden dus nergens tegen een tenant
      # getoetst. Deze stap is het enige dat faalt wanneer de afspraken zichzelf tegenspreken -
      # met name de twee koppelingen die stil kapotgaan: 2120 eist een phishing-bestendige
      # methode die er niet is, of 2180 eist een TAP die uit staat.
      - name: Controleer het authenticatiemethode-beleid
        run: node scripts/authentication-methods.js

      - name: Bewaak de gepinde checkId-nummers en de randvoorwaarden
        run: node --test scripts/generate-baseline.test.js scripts/prerequisites.test.js scripts/export-cipp-baseline.test.js scripts/check-controls.test.js scripts/authentication-methods.test.js
      # Alleen op main. Op een pull_request is genereren de toets ("blijft dit deterministisch
      # en compleet?"); een PR openen bovenop een PR is dat niet.
      - name: Open PR met de gegenereerde baseline (als er iets veranderde)
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenereer baseline/conditional-access/baseline-v1.0.json uit CATemplate/"
          title: "Baseline geregenereerd uit CATemplate/"
          body: >
            Automatisch gegenereerd door `.github/workflows/generate-baseline.yml` na een
            wijziging in `CATemplate/`. Controleer de diff — met name nieuwe/verwijderde
            checkId's en gewijzigde `params` — vóór je merget. `baseline/` is de bron voor
            de `conditional-access`-categorie in de baseline-koppeling van TEST Policies
            Platform (Instellingen → Baseline-koppelingen); `cipp/` is de uitrolkant en
            staat altijd volledig op `Report` — het omzetten naar `Remediate` gebeurt per
            klanttenant, ná `scripts/New-CaPrerequisites.ps1`.
          branch: auto/regenerate-baseline
          delete-branch: true
          add-paths: |
            baseline/conditional-access/baseline-v1.0.json
            cipp/ca-templates-import.json
            cipp/baseline-stages.json
